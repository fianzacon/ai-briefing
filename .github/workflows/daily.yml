name: Daily AI Briefing

on:
  schedule:
    - cron: '0 23 * * *'  # 매일 오전 8시 KST (UTC 23:00 전날)
  workflow_dispatch:       # 수동 실행 버튼도 활성화

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install feedparser anthropic requests

      - name: 브리핑 실행
        env:
          CLAUDE_API_KEY:  ${{ secrets.CLAUDE_API_KEY }}
          WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
          WEBEX_ROOM_ID:   ${{ secrets.WEBEX_ROOM_ID }}
        run: python main.py
